name: Build EPA Rust Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: epa-backend-rust
          
      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: epa-backend-rust
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: epa-engine-${{ matrix.target }}
          path: |
            epa-backend-rust/target/${{ matrix.target }}/release/epa-backend-rust
            epa-backend-rust/target/${{ matrix.target }}/release/epa-backend-rust.exe
